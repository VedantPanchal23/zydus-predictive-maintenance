name: zydus-pm

x-app-env: &app-env
  DATABASE_URL: postgresql://${APP_DB_USER:-zydus_user}:${APP_DB_PASSWORD:-zydus_pass}@postgres:5432/${APP_DB_NAME:-zydus_db}
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  ML_ARTIFACTS_DIR: /app/ml_artifacts
  JWT_SECRET: ${JWT_SECRET:-change-this-before-production}
  PREDICTION_CACHE_TTL_SECONDS: ${PREDICTION_CACHE_TTL_SECONDS:-300}
  CRITICAL_FAILURE_PROB_THRESHOLD: ${CRITICAL_FAILURE_PROB_THRESHOLD:-0.80}
  WARNING_FAILURE_PROB_THRESHOLD: ${WARNING_FAILURE_PROB_THRESHOLD:-0.40}
  CRITICAL_ANOMALY_THRESHOLD: ${CRITICAL_ANOMALY_THRESHOLD:-0.90}
  WARNING_ANOMALY_THRESHOLD: ${WARNING_ANOMALY_THRESHOLD:-0.85}
  CRITICAL_DAYS_TO_FAILURE_THRESHOLD: ${CRITICAL_DAYS_TO_FAILURE_THRESHOLD:-3}
  WARNING_DAYS_TO_FAILURE_THRESHOLD: ${WARNING_DAYS_TO_FAILURE_THRESHOLD:-14}
  CRITICAL_ALERT_COOLDOWN_HOURS: ${CRITICAL_ALERT_COOLDOWN_HOURS:-6}
  WARNING_ALERT_COOLDOWN_HOURS: ${WARNING_ALERT_COOLDOWN_HOURS:-2}
  PREDICTION_STALE_MINUTES: ${PREDICTION_STALE_MINUTES:-10}

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: zydus-postgres
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-zydus_db}
      POSTGRES_USER: ${APP_DB_USER:-zydus_user}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-zydus_pass}
    ports:
      - "${APP_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - zydus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER:-zydus_user} -d ${APP_DB_NAME:-zydus_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: zydus-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - zydus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zydus-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,stat,srvr"
    networks:
      - zydus-network
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 5"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: zydus-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_HOST:-localhost}:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - zydus-network
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:9092 1 5"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  fastapi-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: zydus-backend:local
    container_name: zydus-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - ../ml/artifacts:/app/ml_artifacts
    environment:
      <<: *app-env
    networks:
      - zydus-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.0
    container_name: zydus-grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3001"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_HTTP_PORT=3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../docs/grafana:/var/lib/grafana/dashboards:ro
    networks:
      - zydus-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3001/api/health | grep -q 'ok' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  simulator:
    build:
      context: ../simulator
      dockerfile: Dockerfile
    image: zydus-pm-simulator:latest
    container_name: zydus-simulator
    depends_on:
      kafka:
        condition: service_healthy
      fastapi-backend:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:29092
    volumes:
      - ../simulator:/app
    networks:
      - zydus-network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os; os.kill(1, 0)' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: always

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: zydus-pm-frontend:latest
    container_name: zydus-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      fastapi-backend:
        condition: service_healthy
    networks:
      - zydus-network
    restart: unless-stopped

networks:
  zydus-network:
    name: zydus-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  grafana_data:
