name: Zydus GxP Continuous Integration & Reliability Pipeline

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-qa:
    name: Backend Pytest, ML & 21 CFR Hash Chain Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: zydus_pm
          POSTGRES_USER: zydus_admin
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx flake8 bandit reportlab qrcode[pil]

      - name: Static Security Scan (Bandit)
        run: |
          bandit -r backend -ll -ii --exclude backend/tests

      - name: Python Code Linting (Flake8)
        run: |
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Initialize Database Schema
        env:
          DATABASE_URL: postgresql://zydus_admin:password123@localhost:5432/zydus_pm
        run: |
          PGPASSWORD=password123 psql -h localhost -U zydus_admin -d zydus_pm -f backend/db/schema.sql

      - name: Run Backend Pytest Suite with Coverage
        env:
          DATABASE_URL: postgresql://zydus_admin:password123@localhost:5432/zydus_pm
          REDIS_URL: redis://localhost:6379/0
          READ_ONLY_MODE: "0"
        run: |
          pytest -v --cov=backend --cov=ml

  frontend-qa:
    name: Frontend React Build & Linting Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify Production Bundle Build
        working-directory: frontend
        run: npm run build

  container-qa:
    name: Docker Container Multi-Service Image Build
    runs-on: ubuntu-latest
    needs: [backend-qa, frontend-qa]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Topology
        run: |
          docker compose -f infra/docker-compose.yml build
