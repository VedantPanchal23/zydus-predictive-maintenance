apiVersion: apps/v1
kind: Deployment
metadata:
  name: zydus-backend
  namespace: zydus-pm
  labels:
    app: zydus-backend
    tier: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: zydus-backend
  template:
    metadata:
      labels:
        app: zydus-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: fastapi-backend
          image: zydus-pm-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: zydus-pm-config
            - secretRef:
                name: zydus-pm-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: zydus-backend
  namespace: zydus-pm
spec:
  type: ClusterIP
  selector:
    app: zydus-backend
  ports:
    - port: 8000
      targetPort: 8000
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zydus-backend-hpa
  namespace: zydus-pm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zydus-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
